<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAMRUL — Dashboard</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#f5f0df;font-family:system-ui,sans-serif;padding:24px}main{max-width:700px;margin:8vh auto;padding:28px;border:1px solid #b99748;border-radius:18px;background:#101d2d}h1{color:#e5c46a}img{width:72px;height:72px;border-radius:50%;object-fit:cover}button{padding:12px 20px;border:0;border-radius:9px;background:#d5b45b;font-weight:700;cursor:pointer}#details{line-height:1.8;color:#d7deea}</style></head><body><main><h1>KAMRUL Dashboard</h1><div id="details">Loading account…</div><form action="/logout" method="post"><button type="submit">Logout</button></form></main><script>fetch("/api/me").then(async r=>{if(!r.ok){location.href="/";return}const data=await r.json(),u=data.user;document.getElementById("details").innerHTML=(u.photo?`<img src="${u.photo}" alt="Profile photo">`:"")+`<p><b>Name:</b> ${escapeHtml(u.name||"")}</p><p><b>Email:</b> ${escapeHtml(u.email||"")}</p>`});function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}</script></body></html>
